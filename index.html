<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<title>Photos</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #f4f2ee; --panel: #ffffff; --text: #1c1c1a; --muted: #6b6a64; --line: #dedbd3;
    --accent: #1d5f8a; --accent-text: #ffffff; --bad: #a3271f; --cell: #e4e1d9;
    --pad: max(16px, env(safe-area-inset-left));
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1f1f1d; --text: #edece7; --muted: #a09f98; --line: #34342f;
      --accent: #86bde2; --accent-text: #0f1f2a; --bad: #f08c84; --cell: #262623;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden;
    font: 17px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  h1, h2, p { margin: 0; }

  /* Each screen is its own scrolling layer, so it keeps its place while another one is on top. */
  .layer { position: fixed; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg); }
  .layer.off { visibility: hidden; pointer-events: none; }
  .bar {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px;
    padding: calc(8px + env(safe-area-inset-top)) var(--pad) 8px;
    background: var(--bg); border-bottom: 1px solid var(--line);
  }
  .bar h1 { font-size: 1.15rem; font-weight: 650; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .sub { color: var(--muted); font-size: 0.85rem; font-weight: 400; display: block; }
  .bar button { border: 0; background: none; color: var(--accent); padding: 10px 6px; min-height: 44px; white-space: nowrap; }
  .body { padding: 8px var(--pad) calc(24px + env(safe-area-inset-bottom)); max-width: 760px; margin: 0 auto; }
  .muted { color: var(--muted); }
  .small { font-size: 0.9rem; }

  .btn {
    display: inline-block; padding: 12px 18px; min-height: 48px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel);
  }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .btn.wide { display: block; width: 100%; text-align: center; margin-top: 12px; }
  input[type=text] {
    width: 100%; padding: 12px; margin-top: 6px; font: inherit; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  }

  /* notice strip */
  #notice {
    position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 30;
    max-width: 640px; margin: 0 auto; padding: 12px 14px; border-radius: 10px;
    background: var(--text); color: var(--bg); font-size: 0.95rem; display: flex; gap: 12px; align-items: flex-start;
  }
  #notice[hidden] { display: none; }
  #notice p { flex: 1; overflow-wrap: anywhere; white-space: pre-wrap; }
  #notice button { border: 0; background: none; color: inherit; font-weight: 650; padding: 0 4px; }

  /* sign in */
  #signin .body { padding-top: 12vh; }
  #signin h1 { font-size: 1.6rem; margin-bottom: 8px; }
  #signinError { color: var(--bad); margin-top: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }

  /* albums */
  .year { margin: 22px 0 6px; font-size: 0.85rem; font-weight: 650; color: var(--muted); letter-spacing: 0.04em; }
  .rows { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .rows button {
    display: flex; width: 100%; align-items: center; gap: 12px; text-align: left;
    padding: 13px 14px; min-height: 50px; border: 0; border-top: 1px solid var(--line); background: none;
  }
  .rows button:first-child { border-top: 0; }
  .rows button span:first-child { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .rows button .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .rows button .n::after { content: "  \203A"; }

  /* grid */
  #cells { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding-bottom: env(safe-area-inset-bottom); }
  @media (min-width: 560px) { #cells { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); } }
  .cell { position: relative; aspect-ratio: 1; padding: 0; border: 0; background: var(--cell); overflow: hidden; }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity 0.2s; }
  .cell img.in { opacity: 1; }
  .cell .tag {
    position: absolute; left: 4px; bottom: 4px; padding: 1px 6px; border-radius: 5px;
    background: rgba(0, 0, 0, 0.66); color: #fff; font-size: 0.75rem; font-variant-numeric: tabular-nums;
  }
  .cell.missing::after {
    content: "not found"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 0.75rem;
  }
  #gridEnd { height: 1px; }
  #gridNote { padding: 28px var(--pad); text-align: center; }

  /* one photo */
  #photo { position: fixed; inset: 0; z-index: 10; background: #000; color: #fff; display: flex; flex-direction: column; }
  #photo.off { visibility: hidden; pointer-events: none; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #stage img, #stage video { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  #stage img.blur { width: 100%; height: 100%; filter: blur(12px); opacity: 0.55; }
  #stage video { width: 100%; height: 100%; background: #000; }
  #stage .msg { color: #bbb; padding: 24px; text-align: center; }
  #photoTop, #photoInfo { position: absolute; left: 0; right: 0; z-index: 2; transition: opacity 0.2s; }
  #photoTop {
    top: 0; display: flex; align-items: center; gap: 8px;
    padding: calc(6px + env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) 18px max(8px, env(safe-area-inset-left));
    background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0));
  }
  #photoTop button { border: 0; background: none; color: #fff; padding: 10px; min-height: 44px; min-width: 44px; }
  #photoTop .count { flex: 1; text-align: center; font-size: 0.9rem; color: #ddd; font-variant-numeric: tabular-nums; }
  #photoInfo {
    bottom: 0; padding: 30px max(16px, env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.78) 45%); pointer-events: none;
  }
  #photoInfo p { max-width: 760px; margin: 0 auto; overflow-wrap: anywhere; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); }
  #photoInfo .cap { font-size: 1.05rem; }
  #photoInfo .meta { color: #d8d8d4; font-size: 0.9rem; margin-top: 2px; }
  #photoInfo .stars { color: #f3c64b; letter-spacing: 2px; margin-top: 2px; }
  #photo.bare #photoTop, #photo.bare #photoInfo { opacity: 0; pointer-events: none; }
  #photo.video #photoInfo { position: static; margin-top: auto; background: #000; padding-top: 10px; pointer-events: auto; }
  #photo.video #stage { position: relative; flex: 1; min-height: 0; margin-top: calc(56px + env(safe-area-inset-top)); }
  #photo.video #photoTop { background: #000; padding-bottom: 6px; }
  .side { position: absolute; top: 20%; bottom: 20%; width: 18%; z-index: 1; border: 0; background: none; color: #fff; font-size: 2rem; opacity: 0; }
  .side.prev { left: 0; } .side.next { right: 0; }
  @media (hover: hover) { .side:hover { opacity: 0.85; text-shadow: 0 0 6px #000; } }

  /* settings */
  dl { margin: 0; }
  dl div { display: flex; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
  dl div:first-child { border-top: 0; }
  dt { color: var(--muted); flex: 0 0 42%; } dd { margin: 0; flex: 1; overflow-wrap: anywhere; }
  .spin { display: inline-block; width: 1.1em; height: 1.1em; vertical-align: -0.2em; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } .cell img, #photoTop, #photoInfo { transition: none; } }
</style>
</head>
<body>

<section id="signin" class="layer off">
  <div class="body">
    <h1>Photos</h1>
    <p class="muted">Sign in with the Microsoft account that holds the photos. This viewer can only look: it cannot change or delete anything.</p>
    <div id="clientBox" hidden>
      <label for="clientId" class="small" style="display:block;margin-top:18px;font-weight:600">Application (client) ID</label>
      <input type="text" id="clientId" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
    </div>
    <button class="btn primary wide" id="signInBtn">Sign in</button>
    <p id="signinError" role="alert"></p>
  </div>
</section>

<section id="albums" class="layer off">
  <header class="bar"><h1>Photos</h1><button id="openSettings">Settings</button></header>
  <div class="body" id="albumList"><p class="muted" style="padding-top:24px"><span class="spin"></span> Getting the photo list…</p></div>
</section>

<section id="grid" class="layer off">
  <header class="bar"><button class="back" data-back aria-label="Back to albums">&#8249; Albums</button><h1 id="gridTitle"></h1></header>
  <div id="cells"></div>
  <div id="gridEnd"></div>
  <p id="gridNote" class="muted small" hidden></p>
</section>

<section id="settings" class="layer off">
  <header class="bar"><button class="back" data-back aria-label="Back">&#8249; Back</button><h1>Settings</h1></header>
  <div class="body">
    <p class="year">PHOTO LIST</p>
    <div class="rows"><dl id="aboutList"></dl></div>
    <button class="btn wide" id="checkNow">Check for new information now</button>
    <p class="year">THIS DEVICE</p>
    <div class="rows"><dl id="deviceList"></dl></div>
    <button class="btn wide" id="signOut">Sign out</button>
    <p class="muted small" style="margin-top:10px">Sign out forgets the sign-in and the photo list kept on this device.</p>
  </div>
</section>

<section id="photo" class="off" aria-label="Photo">
  <div id="photoTop"><button id="photoBack" aria-label="Back to the grid">&#8249; Back</button><span class="count" id="photoCount"></span><span style="width:60px"></span></div>
  <div id="stage"></div>
  <button class="side prev" id="prevBtn" aria-label="Previous photo">&#8249;</button>
  <button class="side next" id="nextBtn" aria-label="Next photo">&#8250;</button>
  <div id="photoInfo"></div>
</section>

<div id="notice" hidden role="status"><p id="noticeText"></p><button id="noticeClose" aria-label="Dismiss">OK</button></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
